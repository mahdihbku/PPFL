[project]
name = "ppfl"
version = "0.3.0"
description = "Verifiable committee-based secure aggregation for federated learning"
requires-python = ">=3.12"
dependencies = ["numpy", "cryptography", "pynacl", "coincurve"]

[project.optional-dependencies]
test = ["pytest"]
bench = ["pandas", "matplotlib"]
fl = ["torch", "scikit-learn", "pandas"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ppfl*"]
